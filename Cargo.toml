[workspace]
resolver = "2"
members = ["crates/sona-core", "crates/sona-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[profile.release]
debug = 1

# Os testes simulam minutos de áudio; sem otimização levariam muito tempo.
[profile.test]
opt-level = 2

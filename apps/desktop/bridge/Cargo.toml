[package]
name = "sona-bridge-desktop"
description = "Sona Bridge (app desktop): envia e recebe áudio do servidor Sona, na bandeja do sistema."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sona-bridge-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sona-bridge = { path = "../../../crates/sona-bridge" }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tokio = { version = "1", features = ["net", "sync"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

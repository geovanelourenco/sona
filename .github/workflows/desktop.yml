name: Instaladores Windows
on:
  push:
    branches: [main, multi-dispositivo-bridge]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface (console e tela do bridge)
        run: npm ci && npm run build
        working-directory: apps/mixer-web
      - name: Instalador do Sona
        run: npx -y @tauri-apps/cli@2.12.6 build
        working-directory: apps/desktop/sona
      - name: Instalador do Sona Bridge
        run: npx -y @tauri-apps/cli@2.12.6 build
        working-directory: apps/desktop/bridge
      - name: Ferramentas de linha de comando
        run: cargo build --release -p sona-server -p sona-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linha-de-comando-windows
          path: |
            target/release/sona-server.exe
            target/release/sona-bridge.exe

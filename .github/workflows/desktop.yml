name: Instaladores Windows
on:
  push:
    branches: [main, multi-dispositivo-bridge]
  workflow_dispatch:
# Publica numa Release de pré-lançamento (não usa a cota de artefatos do Actions).
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface (console e tela do bridge)
        run: npm ci && npm run build
        working-directory: apps/mixer-web
      - name: Instalador do Sona
        run: npx -y @tauri-apps/cli@2.12.6 build
        working-directory: apps/desktop/sona
      - name: Plugin do OBS (vai dentro do instalador do bridge)
        run: cargo build --release -p sona-obs
      - name: Instalador do Sona Bridge
        run: npx -y @tauri-apps/cli@2.12.6 build
        working-directory: apps/desktop/bridge
      - name: Ferramentas de linha de comando
        run: cargo build --release -p sona-server -p sona-bridge
      - name: Juntar arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force saida | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe saida/
          Compress-Archive -Force -Path target/release/sona-server.exe, target/release/sona-bridge.exe -DestinationPath saida/sona-linha-de-comando-windows.zip
          # Plugin avulso, na estrutura de pastas do OBS (para instalar à mão).
          New-Item -ItemType Directory -Force plugin/sona-obs/bin/64bit, plugin/sona-obs/data | Out-Null
          Copy-Item target/release/sona_obs.dll plugin/sona-obs/bin/64bit/sona-obs.dll
          Compress-Archive -Force -Path plugin/sona-obs -DestinationPath saida/plugin-obs-sona-windows.zip
          Get-ChildItem saida
      - name: Publicar na Release de pré-lançamento
        uses: softprops/action-gh-release@v2
        with:
          tag_name: instaladores-${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Instaladores (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Instaladores do Sona e do Sona Bridge para Windows, gerados do branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Não assinados: o SmartScreen avisa na primeira execução ("Mais informações" → "Executar assim mesmo").
            Nada aqui foi validado com a Ui24R; ver docs/spec/checklist.md.
          files: saida/*
          overwrite_files: true
